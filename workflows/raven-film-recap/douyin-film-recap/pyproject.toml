[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-film-recap"
version = "0.3.0"
description = "Agent skill and runtime for generating Douyin-style film and TV recap videos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Douyin Film Recap contributors"}]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.1",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  # PySceneDetect 0.7+ ships separate distributions; the plain one pulls GUI OpenCV.
  "scenedetect-headless>=0.7.2,<0.8",
  "jsonschema>=4.23,<5",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
# Explicit opt-in; deliberately excluded from all/default runtime. No model weights.
local-alignment = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "safetensors==0.6.2",
]
local-asr = [
  "faster-whisper>=1.0.3,<2",
]
tts = [
  "edge-tts>=7.2.0,<8",
]
all = [
  "faster-whisper>=1.0.3,<2",
  "edge-tts>=7.2.0,<8",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  # Official native-JSON parser acceptance in CI; exporter has no runtime OTIO dependency.
  "opentimelineio==0.18.1",
]

[project.scripts]
douyin-film-recap = "douyin_film_recap.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
